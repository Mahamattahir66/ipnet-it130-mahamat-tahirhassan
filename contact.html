<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page de contact de mon blog - IT 130">
    <title>Contact - Mon Blog</title>
</head>
<body>
    <header>
        <h1>Contactez-moi</h1>
        <nav>
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Formulaire de Contact</h2>
            <p>Remplissez ce formulaire pour me contacter. Je vous répondrai dans les plus brefs délais.</p>

            <form action="#" method="post">

    <!-- Groupe 1 : Informations personnelles -->
    <fieldset>
        <legend>Informations personnelles</legend>

        <!-- Champ Nom -->
        <div>
            <label for="nom">Nom complet <span aria-hidden="true">*</span> :</label>
            <input type="text" id="nom" name="nom"
                   placeholder="Votre nom complet"
                   required minlength="2" maxlength="50">
        </div>

        <!-- Champ Email -->
        <div>
            <label for="email">Email <span aria-hidden="true">*</span> :</label>
            <input type="email" id="email" name="email"
                   placeholder="votre.email@example.com"
                   required>
        </div>

        <!-- Champ Téléphone -->
        <div>
            <label for="telephone">Téléphone (optionnel) :</label>
            <input type="tel" id="telephone" name="telephone"
                   placeholder="+228 99 99 99 99"
                   pattern="[+0-9 ]{8,20}">
        </div>
    </fieldset>

    <!-- LA SUITE DU FORMULAIRE SERA AJOUTÉE ICI -->

</form>
        </section>
    </main>

    <footer>
        <p>© 2026 Mon Blog - Créé par Mahamat Tahir Hassan</p>
    </footer>
</body>
</html>
